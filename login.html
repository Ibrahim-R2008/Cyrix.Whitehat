<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - White Hat Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error {
            color: #e53e3e;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .forgot-password {
            text-align: center;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .user-type-selector {
            margin-bottom: 20px;
        }

        .user-type-tabs {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ddd;
        }

        .user-type-tab {
            flex: 1;
            padding: 12px;
            background: #f7fafc;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .user-type-tab.active {
            background: #667eea;
            color: white;
        }

        .user-type-tab:hover:not(.active) {
            background: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><img src="logo.png" alt="White Hat Platform" style="height: 55px; vertical-align: middle; margin-right: 15px;">Login</h1>
        <p class="subtitle">Welcome back to White Hat Platform</p>

        <div class="user-type-selector">
            <div class="user-type-tabs">
                <button class="user-type-tab active" data-type="whitehat">White Hat</button>
                <button class="user-type-tab" data-type="client">Client</button>
            </div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required>
                <div class="error" id="passwordError"></div>
            </div>

            <div class="forgot-password">
                <a href="#" onclick="alert('Password reset functionality would be implemented here')">Forgot your password?</a>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="back-link">
            <a href="index.html">← Back to Home</a> | 
            <a href="signin.html">Don't have an account? Sign Up</a>
        </div>
    </div>

    <script>
        let selectedUserType = 'whitehat';

        // Handle user type selection
        document.querySelectorAll('.user-type-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // Remove active class from all tabs
                document.querySelectorAll('.user-type-tab').forEach(t => t.classList.remove('active'));
                
                // Add active class to clicked tab
                this.classList.add('active');
                
                // Update selected user type
                selectedUserType = this.dataset.type;
            });
        });

        // Form validation and submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.error').forEach(error => error.textContent = '');
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            let isValid = true;

            // Basic validation
            if (!email || !email.includes('@')) {
                document.getElementById('emailError').textContent = 'Valid email is required';
                isValid = false;
            }

            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                isValid = false;
            }

            if (isValid) {
                // Simulate login process
                const userTypeText = selectedUserType === 'whitehat' ? 'White Hat Hacker' : 'Client';
                alert(`Login successful! Welcome back, ${userTypeText}!`);
                
                // In a real application, you would redirect to a dashboard
                // For now, we'll just redirect back to home
                window.location.href = 'index.html';
            }
        });

        // Auto-focus email field
        document.getElementById('email').focus();
    </script>
</body>
</html>
