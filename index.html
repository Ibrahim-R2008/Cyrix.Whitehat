<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Hat Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .user-type-selection {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .user-type-btn {
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
        }

        .user-type-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .user-type-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><img src="logo.png" alt="White Hat Platform" style="height: 60px; vertical-align: middle; margin-right: 15px;">White Hat Platform</h1>
        <p class="subtitle">Choose your role to get started</p>
        
        <div class="user-type-selection">
            <div class="user-type-btn" data-type="whitehat">
                <h3>I am a White Hat Hacker</h3>
                <p>Offering cybersecurity services and ethical hacking</p>
            </div>
            <div class="user-type-btn" data-type="client">
                <h3>I need White Hat Services</h3>
                <p>Company or individual looking for cybersecurity help</p>
            </div>
        </div>

        <div class="action-buttons">
            <a href="signin.html" class="btn btn-primary" id="signupBtn">Sign Up</a>
            <a href="login.html" class="btn btn-secondary">Login</a>
        </div>
    </div>

    <script>
        let selectedUserType = '';

        document.querySelectorAll('.user-type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove selected class from all buttons
                document.querySelectorAll('.user-type-btn').forEach(b => b.classList.remove('selected'));
                
                // Add selected class to clicked button
                this.classList.add('selected');
                
                // Store selected user type
                selectedUserType = this.dataset.type;
                
                // Update signup link to include user type
                const signupBtn = document.getElementById('signupBtn');
                signupBtn.href = `signin.html?type=${selectedUserType}`;
            });
        });
    </script>
</body>
</html>
