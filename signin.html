<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - White Hat Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error {
            color: #e53e3e;
            font-size: 0.9em;
            margin-top: 5px;
            font-weight: bold;
            background: #fed7d7;
            padding: 5px 8px;
            border-radius: 4px;
            border-left: 4px solid #e53e3e;
            display: none;
        }

        .error.show {
            display: block;
        }

        .input-error {
            border-color: #e53e3e !important;
            background-color: #fed7d7;
        }

        .input-success {
            border-color: #38a169 !important;
            background-color: #f0fff4;
        }

        .success-indicator {
            color: #38a169;
            font-size: 0.9em;
            margin-top: 5px;
            font-weight: bold;
            background: #f0fff4;
            padding: 5px 8px;
            border-radius: 4px;
            border-left: 4px solid #38a169;
            display: none;
        }

        .success-indicator.show {
            display: block;
        }

        .hidden {
            display: none;
        }

        .user-type-indicator {
            background: #667eea;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .success {
            color: #38a169;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .success-message {
            background: #f0fff4;
            border: 2px solid #38a169;
            color: #38a169;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .otp-section {
            background: #f8f9ff;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }

        .otp-section.show {
            display: block;
        }

        .otp-title {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .otp-info {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
            text-align: center;
        }

        .otp-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .otp-digit {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s ease;
        }

        .otp-digit:focus {
            outline: none;
            border-color: #667eea;
        }

        .otp-digit.filled {
            border-color: #38a169;
            background-color: #f0fff4;
        }

        .otp-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-outline {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><img src="logo.png" alt="White Hat Platform" style="height: 55px; vertical-align: middle; margin-right: 15px;">Sign Up</h1>
        <div class="user-type-indicator" id="userTypeIndicator">
            Loading...
        </div>

        <div class="success-message" id="successMessage">
            ✅ All information is valid! Ready to create your account.
        </div>

        <form id="signupForm">
            <!-- White Hat Hacker Fields -->
            <div id="whitehackerFields" class="hidden">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" required>
                    <div class="error" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label for="purpose">I'm looking for *</label>
                    <select id="purpose" name="purpose" required>
                        <option value="">Select Purpose</option>
                        <option value="job">Job Opportunities</option>
                        <option value="training">Training & Learning</option>
                    </select>
                    <div class="error" id="purposeError"></div>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                    <div class="error" id="dobError"></div>
                </div>

                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                    <div class="error" id="genderError"></div>
                </div>

                <div class="form-group">
                    <label for="nationalId">National ID Number *</label>
                    <input type="text" id="nationalId" name="nationalId" required>
                    <div class="error" id="nationalIdError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                    <button type="button" onclick="sendTestOTP('email')" style="margin-top: 5px; padding: 5px 10px; background: #4299e1; color: white; border: none; border-radius: 4px;">Send OTP</button>
                    <span class="error-message" id="emailError"></span>
                    <span class="success-message" id="emailSuccess"></span>
                </div>

                <div class="otp-section" id="otpSection">
                    <div class="otp-title">📧 Email Verification</div>
                    <div class="otp-info" id="otpInfo">We've sent a 6-digit code to your email</div>
                    <div class="otp-input-group">
                        <input type="text" class="otp-digit" id="otp1" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="otp2" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="otp3" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="otp4" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="otp5" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="otp6" maxlength="1" pattern="[0-9]">
                    </div>
                    <div class="error" id="otpError"></div>
                    <div class="otp-actions">
                        <button type="button" class="btn btn-outline btn-small" id="resendOtp">Resend Code</button>
                        <button type="button" class="btn btn-primary btn-small" id="verifyOtp">Verify Code</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" required>
                    <div class="error" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <div class="error" id="confirmPasswordError"></div>
                </div>
            </div>

            <!-- Client Fields -->
            <div id="clientFields" class="hidden">
                <div class="form-group">
                    <label for="clientType">I am a *</label>
                    <select id="clientType" name="clientType" required>
                        <option value="">Select Type</option>
                        <option value="person">Individual Person</option>
                        <option value="company">Company/Organization</option>
                    </select>
                    <div class="error" id="clientTypeError"></div>
                </div>

                <div class="form-group">
                    <label for="companyName">Name *</label>
                    <input type="text" id="companyName" name="companyName" required placeholder="Enter your name or company name">
                    <div class="error" id="companyNameError"></div>
                </div>

                <div class="form-group">
                    <label for="date">Date of Birth *</label>
                    <input type="date" id="date" name="date" required>
                    <div class="error" id="dateError"></div>
                </div>

                <div class="form-group">
                    <label for="purpose">Purpose/Requirements *</label>
                    <select id="purpose" name="purpose" required>
                        <option value="">Select Purpose</option>
                        <option value="penetration-testing">Penetration Testing</option>
                        <option value="vulnerability-assessment">Vulnerability Assessment</option>
                        <option value="security-audit">Security Audit</option>
                        <option value="incident-response">Incident Response</option>
                        <option value="security-consultation">Security Consultation</option>
                        <option value="other">Other</option>
                    </select>
                    <div class="error" id="purposeError"></div>
                </div>

                <div class="form-group" id="clientNationalIdGroup">
                    <label for="clientNationalId">National ID Number *</label>
                    <input type="text" id="clientNationalId" name="clientNationalId">
                    <div class="error" id="clientNationalIdError"></div>
                </div>

                <div class="form-group">
                    <label for="clientEmail">Email *</label>
                    <input type="email" id="clientEmail" name="clientEmail" required>
                    <div class="error" id="clientEmailError"></div>
                </div>

                <div class="otp-section" id="clientOtpSection">
                    <div class="otp-title">📧 Email Verification</div>
                    <div class="otp-info" id="clientOtpInfo">We've sent a 6-digit code to your email</div>
                    <div class="otp-input-group">
                        <input type="text" class="otp-digit" id="clientOtp1" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="clientOtp2" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="clientOtp3" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="clientOtp4" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="clientOtp5" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-digit" id="clientOtp6" maxlength="1" pattern="[0-9]">
                    </div>
                    <div class="error" id="clientOtpError"></div>
                    <div class="otp-actions">
                        <button type="button" class="btn btn-outline btn-small" id="clientResendOtp">Resend Code</button>
                        <button type="button" class="btn btn-primary btn-small" id="clientVerifyOtp">Verify Code</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="clientPassword">Password *</label>
                    <input type="password" id="clientPassword" name="clientPassword" required>
                    <div class="error" id="clientPasswordError"></div>
                </div>

                <div class="form-group">
                    <label for="clientConfirmPassword">Confirm Password *</label>
                    <input type="password" id="clientConfirmPassword" name="clientConfirmPassword" required>
                    <div class="error" id="clientConfirmPasswordError"></div>
                </div>
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="back-link">
            <a href="index.html">← Back to Home</a> | 
            <a href="login.html">Already have an account? Login</a>
        </div>
    </div>

    <script>
        // Get user type from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const userType = urlParams.get('type') || 'whitehat';

        // Update UI based on user type
        const userTypeIndicator = document.getElementById('userTypeIndicator');
        const whitehackerFields = document.getElementById('whitehackerFields');
        const clientFields = document.getElementById('clientFields');

        if (userType === 'whitehat') {
            userTypeIndicator.textContent = '👨‍💻 Signing up as White Hat Hacker';
            whitehackerFields.classList.remove('hidden');
            clientFields.classList.add('hidden');
        } else {
            userTypeIndicator.textContent = '🏢 Signing up as Client';
            clientFields.classList.remove('hidden');
            whitehackerFields.classList.add('hidden');
        }

        // Form validation and submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.error').forEach(error => {
                error.textContent = '';
                error.classList.remove('show');
            });
            document.querySelectorAll('input, select').forEach(input => {
                input.classList.remove('input-error');
            });
            
            let isValid = true;

            if (userType === 'whitehat') {
                // Validate white hat fields
                const name = document.getElementById('name').value.trim();
                const dob = document.getElementById('dob').value;
                const gender = document.getElementById('gender').value;
                const purpose = document.getElementById('purpose').value;
                const nationalId = document.getElementById('nationalId').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (!name) {
                    showError('name', 'Name is required');
                    isValid = false;
                } else {
                    const nameWords = name.trim().split(/\s+/);
                    if (nameWords.length < 3) {
                        showError('name', 'White Hat name must be at least 3 words (First Middle Last)');
                        isValid = false;
                    }
                }

                if (!dob) {
                    showError('dob', 'Date of birth is required');
                    isValid = false;
                } else {
                    // Age validation based on purpose
                    const birthDate = new Date(dob);
                    const today = new Date();
                    const age = today.getFullYear() - birthDate.getFullYear();
                    const monthDiff = today.getMonth() - birthDate.getMonth();
                    const actualAge = (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) ? age - 1 : age;
                    
                    if (purpose === 'training' && actualAge <= 13) {
                        showError('dob', `You are ${actualAge} years old. You must be older than 13 for training programs.`);
                        isValid = false;
                    } else if (purpose === 'job' && actualAge <= 15) {
                        showError('dob', `You are ${actualAge} years old. You must be over 15 for job opportunities.`);
                        isValid = false;
                    }
                }

                if (!gender) {
                    showError('gender', 'Gender is required');
                    isValid = false;
                }

                if (!purpose) {
                    showError('purpose', 'Please select your purpose');
                    isValid = false;
                }

                if (!nationalId) {
                    showError('nationalId', 'National ID is required');
                    isValid = false;
                } else if (nationalId.length !== 14) {
                    showError('nationalId', 'National ID must be exactly 14 characters');
                    isValid = false;
                } else if (!/^\d{14}$/.test(nationalId)) {
                    showError('nationalId', 'National ID must contain only numbers (14 digits)');
                    isValid = false;
                }

                if (!email) {
                    showError('email', 'Email is required');
                    isValid = false;
                } else if (!email.includes('@gmail.com')) {
                    showError('email', 'Email must be a Gmail address (@gmail.com)');
                    isValid = false;
                } else if (!email.endsWith('@gmail.com')) {
                    showError('email', 'Email must end with @gmail.com');
                    isValid = false;
                }

                if (password.length < 6) {
                    showError('password', 'Password must be at least 6 characters');
                    isValid = false;
                }

                if (password !== confirmPassword) {
                    showError('confirmPassword', 'Passwords do not match');
                    isValid = false;
                }

                // Check email verification
                if (!isEmailVerified) {
                    showError('otp', 'Please verify your email address first');
                    isValid = false;
                }
            } else {
                // Validate client fields
                const clientType = document.getElementById('clientType').value;
                const companyName = document.getElementById('companyName').value.trim();
                const date = document.getElementById('date').value;
                const purpose = document.getElementById('purpose').value;
                const clientNationalId = document.getElementById('clientNationalId').value.trim();
                const clientEmail = document.getElementById('clientEmail').value.trim();
                const clientPassword = document.getElementById('clientPassword').value;
                const clientConfirmPassword = document.getElementById('clientConfirmPassword').value;

                if (!clientType) {
                    showError('clientType', 'Please select if you are a person or company');
                    isValid = false;
                }

                if (!companyName) {
                    showError('companyName', clientType === 'person' ? 'Your name is required' : 'Company name is required');
                    isValid = false;
                }

                if (!date) {
                    showError('date', 'Date of birth is required');
                    isValid = false;
                } else {
                    // Age validation for clients (must be over 18)
                    const birthDate = new Date(date);
                    const today = new Date();
                    const age = today.getFullYear() - birthDate.getFullYear();
                    const monthDiff = today.getMonth() - birthDate.getMonth();
                    const actualAge = (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) ? age - 1 : age;
                    
                    if (actualAge <= 18) {
                        showError('date', `You are ${actualAge} years old. You must be over 18 to request services.`);
                        isValid = false;
                    }
                }

                if (!purpose) {
                    showError('purpose', 'Purpose is required');
                    isValid = false;
                }

                // Only validate National ID for persons, not companies
                if (clientType === 'person') {
                    if (!clientNationalId) {
                        showError('clientNationalId', 'National ID is required for individuals');
                        isValid = false;
                    } else if (clientNationalId.length !== 14) {
                        showError('clientNationalId', 'National ID must be exactly 14 characters');
                        isValid = false;
                    } else if (!/^\d{14}$/.test(clientNationalId)) {
                        showError('clientNationalId', 'National ID must contain only numbers (14 digits)');
                        isValid = false;
                    }
                }

                if (!clientEmail) {
                    showError('clientEmail', 'Email is required');
                    isValid = false;
                } else if (!clientEmail.includes('@gmail.com')) {
                    showError('clientEmail', 'Email must be a Gmail address (@gmail.com)');
                    isValid = false;
                } else if (!clientEmail.endsWith('@gmail.com')) {
                    showError('clientEmail', 'Email must end with @gmail.com');
                    isValid = false;
                }

                if (clientPassword.length < 6) {
                    showError('clientPassword', 'Password must be at least 6 characters');
                    isValid = false;
                }

                if (clientPassword !== clientConfirmPassword) {
                    showError('clientConfirmPassword', 'Passwords do not match');
                    isValid = false;
                }

                // Check email verification
                if (!isClientEmailVerified) {
                    showError('clientOtp', 'Please verify your email address first');
                    isValid = false;
                }
            }

            if (isValid) {
                // Show success message
                const successMessage = document.getElementById('successMessage');
                successMessage.classList.add('show');
                
                // Wait a moment to show success, then proceed
                setTimeout(() => {
                    alert('✅ Account created successfully! You can now login.');
                    window.location.href = 'login.html';
                }, 1000);
            } else {
                // Hide success message if validation fails
                const successMessage = document.getElementById('successMessage');
                successMessage.classList.remove('show');
            }
        });

        // Set today's date as default for date fields
        const today = new Date().toISOString().split('T')[0];
        if (document.getElementById('dob')) {
            document.getElementById('dob').max = today;
        }
        if (document.getElementById('date')) {
            document.getElementById('date').value = today;
        }

        // Real-time validation functions
        function showError(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            if (errorElement && inputElement) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
                inputElement.classList.add('input-error');
            }
        }

        function clearError(fieldId) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            if (errorElement && inputElement) {
                errorElement.classList.remove('show');
                inputElement.classList.remove('input-error');
            }
        }

        function showSuccess(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            if (errorElement && inputElement) {
                errorElement.textContent = '✅ ' + message;
                errorElement.classList.remove('show');
                errorElement.classList.add('success-indicator', 'show');
                inputElement.classList.remove('input-error');
                inputElement.classList.add('input-success');
            }
        }

        function clearSuccess(fieldId) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            if (errorElement && inputElement) {
                errorElement.classList.remove('success-indicator', 'show');
                inputElement.classList.remove('input-success');
            }
        }

        // Add real-time validation for Name (White Hat only)
        function addNameValidation() {
            const nameField = document.getElementById('name');
            if (nameField) {
                nameField.addEventListener('input', function() {
                    const value = this.value.trim();
                    if (value === '') {
                        clearError('name');
                        clearSuccess('name');
                    } else {
                        const nameWords = value.split(/\s+/);
                        if (nameWords.length < 3) {
                            clearSuccess('name');
                            showError('name', 'White Hat name must be at least 3 words (First Middle Last)');
                        } else {
                            clearError('name');
                            showSuccess('name', 'Valid full name');
                        }
                    }
                });
            }
        }

        // Add real-time validation for National ID
        function addNationalIdValidation(fieldId) {
            const field = document.getElementById(fieldId);
            if (field) {
                field.addEventListener('input', function() {
                    const value = this.value.trim();
                    if (value === '') {
                        clearError(fieldId);
                        clearSuccess(fieldId);
                    } else if (value.length !== 14) {
                        clearSuccess(fieldId);
                        showError(fieldId, 'National ID must be exactly 14 characters');
                    } else if (!/^\d{14}$/.test(value)) {
                        clearSuccess(fieldId);
                        showError(fieldId, 'National ID must contain only numbers (14 digits)');
                    } else {
                        clearError(fieldId);
                        showSuccess(fieldId, 'Valid National ID');
                    }
                });
            }
        }

        // Add real-time validation for Email
        function addEmailValidation(fieldId) {
            const field = document.getElementById(fieldId);
            if (field) {
                field.addEventListener('input', function() {
                    const value = this.value.trim();
                    if (value === '') {
                        clearError(fieldId);
                        clearSuccess(fieldId);
                    } else if (!value.includes('@gmail.com')) {
                        clearSuccess(fieldId);
                        showError(fieldId, 'Email must be a Gmail address (@gmail.com)');
                    } else if (!value.endsWith('@gmail.com')) {
                        clearSuccess(fieldId);
                        showError(fieldId, 'Email must end with @gmail.com');
                    } else {
                        clearError(fieldId);
                        showSuccess(fieldId, 'Valid Gmail address');
                    }
                });
            }
        }

        // Add real-time validation for Password confirmation

                    const actualAge = (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) ? age - 1 : age;

        // Setup OTP input behavior
        function setupOTPInputs(prefix = '') {
            const otpInputs = [];
            for (let i = 1; i <= 6; i++) {
                const input = document.getElementById(`${prefix}otp${i}`);
                if (input) {
                    otpInputs.push(input);
                }
            }

            otpInputs.forEach((input, index) => {
                input.addEventListener('input', function(e) {
                    const value = e.target.value;
                    
                    // Only allow numbers
                    if (!/^[0-9]$/.test(value)) {
                        e.target.value = '';
                        return;
                    }

                    // Add filled class
                    e.target.classList.add('filled');

                    // Move to next input
                    if (value && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }

                    // Check if all inputs are filled
                    const allFilled = otpInputs.every(inp => inp.value !== '');
                    if (allFilled) {
                        const enteredOTP = otpInputs.map(inp => inp.value).join('');
                        if (prefix === 'client') {
                            verifyClientOTP(enteredOTP);
                        } else {
                            verifyOTP(enteredOTP);
                        }
                    }
                });

                input.addEventListener('keydown', function(e) {
                    // Handle backspace
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        otpInputs[index - 1].focus();
                        otpInputs[index - 1].classList.remove('filled');
                    }
                });

                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text');
                    if (/^\d{6}$/.test(pastedData)) {
                        for (let i = 0; i < 6; i++) {
                            if (otpInputs[i]) {
                                otpInputs[i].value = pastedData[i];
                                otpInputs[i].classList.add('filled');
                            }
                        }
                        if (prefix === 'client') {
                            verifyClientOTP(pastedData);
                        } else {
                            verifyOTP(pastedData);
                        }
                    }
                });
            });
        }
